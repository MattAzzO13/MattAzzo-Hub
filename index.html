<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PRISMA — Demo 0.9</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1110;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#b9d3c7;image-rendering:pixelated}
#hud{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 10px);display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.card{background:rgba(20,31,39,.92);color:#fff;border:2px solid #93a5ad;border-radius:13px;padding:8px 12px;box-shadow:0 4px 0 rgba(0,0,0,.25);font-weight:800;letter-spacing:.4px}
#place{font-size:13px}.sub{font-size:10px;opacity:.72;margin-top:2px}
#buttons{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 22px);display:flex;gap:10px}
.action{width:82px;height:54px;border:2px solid #b7c4cb;border-radius:14px;background:#172637;color:#fff;font-weight:900;font-size:13px;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.action:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
#joy{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:150px;height:150px;border-radius:50%;border:3px solid rgba(245,250,248,.9);background:rgba(50,75,66,.42);box-shadow:inset 0 0 0 24px rgba(255,255,255,.04);touch-action:none}
#knob{position:absolute;width:64px;height:64px;left:43px;top:43px;border-radius:50%;background:#b7c1c3;border:3px solid #f1f5f3;box-shadow:0 5px 0 rgba(0,0,0,.22)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 188px);max-width:min(90vw,520px);background:rgba(24,31,34,.95);color:white;padding:11px 15px;border:2px solid #c6d0d2;border-radius:12px;text-align:center;font-weight:750;display:none;z-index:20}
#menu,#dialog,#battle{position:fixed;inset:0;display:none;z-index:30;background:rgba(6,11,12,.72);backdrop-filter:blur(3px)}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92vw,620px);max-height:82vh;overflow:auto;background:#efe7d4;border:4px solid #3f4b51;border-radius:18px;box-shadow:0 10px 0 rgba(0,0,0,.3);color:#243037;padding:18px}
.panel h2{margin:0 0 12px;font-family:Georgia,serif}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #c6baa2}
.close{float:right;border:0;background:#2c3d47;color:#fff;border-radius:9px;padding:8px 12px;font-weight:900}
.monsters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mon{background:#f7f0e1;border:2px solid #9b907b;border-radius:12px;padding:10px}
.sprite{height:72px;display:flex;align-items:center;justify-content:center;font-size:44px}
.badge{display:inline-block;padding:3px 7px;border-radius:8px;background:#d9e7e0;font-size:11px;font-weight:900}
#dialogText{font-family:Georgia,serif;font-size:17px;line-height:1.45}
.dialogNext{margin-top:14px;width:100%;padding:12px;border:0;border-radius:11px;background:#314b58;color:#fff;font-weight:900}
.battlegrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bcard{background:#f7f0e1;border:2px solid #9b907b;border-radius:14px;padding:12px}
.hp{height:10px;background:#5d6767;border-radius:10px;overflow:hidden}.hp i{display:block;height:100%;background:#5e9c5d;width:100%}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.move{padding:10px;border:2px solid #7e7465;background:#e6ddc9;border-radius:10px;font-weight:900}
.small{font-size:12px;opacity:.8}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><div class="card"><div id="place">CASA</div><div class="sub" id="hint">ESPLORA CON IL PAD</div></div><div class="card">PRISMIC <span id="count">0</span></div></div>

<div id="joy"><div id="knob"></div></div>
<div id="buttons"><button class="action" id="aBtn">AZIONE</button><button class="action" id="mBtn">MENU</button></div>
<div id="toast"></div>

<div id="menu"><div class="panel">
<button class="close" data-close="menu">CHIUDI</button>
<h2>Menu</h2>
<div class="row"><b>Squadra</b><span id="teamCount"></span></div>
<div id="teamList" class="monsters" style="margin-top:10px"></div>
<div class="row" style="margin-top:10px"><b>Prismacon</b><span id="dexCount"></span></div>
<div id="dexList" class="monsters" style="margin-top:10px"></div>
</div></div>

<div id="dialog"><div class="panel"><button class="close" data-close="dialog">CHIUDI</button><h2 id="dialogTitle"></h2><div id="dialogText"></div><button class="dialogNext" id="dialogNext">CONTINUA</button></div></div>

<div id="battle"><div class="panel">
<button class="close" data-close="battle">FUGA</button><h2 id="battleTitle">Scontro Prismic</h2>
<div class="battlegrid">
<div class="bcard"><b id="enemyName">Selvatico</b><div class="small" id="enemyType"></div><div class="sprite" id="enemySprite">◆</div><div class="hp"><i id="enemyHP"></i></div></div>
<div class="bcard"><b id="playerName">—</b><div class="small" id="playerType"></div><div class="sprite" id="playerSprite">◇</div><div class="hp"><i id="playerHP"></i></div></div>
</div>
<div class="moves" id="moves"></div>
<div id="battleLog" style="margin-top:12px;font-weight:800"></div>
</div></div>

<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

const TILE=48, MAPW=18, MAPH=16;
const colors={grass:'#6f9861',grass2:'#789f68',road:'#b7aa90',water:'#4e98a4',sand:'#d8c58f',stone:'#77736e',roof:'#615966',wall:'#d4a981',trim:'#f2e9d2',wood:'#684d3d',tree:'#2f6846'};
let scene='house', running=true, toastTimer=0;
let player={x:9*TILE+24,y:9*TILE+20,r:12,speed:150,visible:true,face:'down'};
let returnDoor={x:5,y:13};
let keys={x:0,y:0}, joystickActive=false;
let dialogQueue=[], dialogPos=0;
let team=[{name:'Aurelio',type:'LUCE',level:5,hp:34,max:34,xp:0,xpNext:30,moves:[['Scintilla',8],['Bagliore',10]]}];
let encountered=new Set(['Aurelio']);
const species={
 Aurelio:{name:'Aurelio',type:'LUCE',emoji:'🦊',max:34},
 Brucoro:{name:'Brucoro',type:'INSETTO',emoji:'🪲',max:30},
 Canterva:{name:'Canterva',type:'ACQUA',emoji:'🦀',max:32},
 Erbivela:{name:'Erbivela',type:'ERBA',emoji:'🌿',max:31},
 Foscolupo:{name:'Foscolupo',type:'INSETTO',emoji:'🦋',max:28},
};
const wild=[
 {x:13,y:6,id:'Brucoro',level:3},{x:14,y:10,id:'Canterva',level:4},
 {x:5,y:5,id:'Erbivela',level:3},{x:15,y:13,id:'Foscolupo',level:2}
];
const npcs=[
 {x:11,y:5,name:'Marta',line:'«Il mare di Antignano cambia colore quando arrivano i Prismic d’acqua.»',trainer:true},
 {x:7,y:10,name:'Luca',line:'«Se vuoi allenarti, posso mandare in campo il mio Brucoro.»',trainer:true},
 {x:4,y:6,name:'Neri',line:'«Ho trovato una pianta rarissima vicino a Nugola.»',trade:true}
];
const objects=[
 {x:2,y:2,w:2,h:1,type:'house',door:{x:3,y:3}},
 {x:7,y:2,w:3,h:1,type:'lab',door:{x:8,y:3}},
 {x:12,y:2,w:3,h:1,type:'fort',door:{x:13,y:3}},
 {x:4,y:9,w:2,h:1,type:'house',door:{x:5,y:10}},
 {x:10,y:9,w:2,h:1,type:'house',door:{x:11,y:10}},
];
const walls=[];
for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++) if(x===0||y===0||x===MAPW-1||y===MAPH-1) walls.push({x,y});
const houseDoors=objects.map(o=>o.door);
let battle=null;

function placeName(){
 if(scene==='house')return 'CASA';
 if(scene==='lab')return 'LABORATORIO DEL PROF. ELIO';
 if(scene==='fort1')return 'FORTEZZA VECCHIA · PIANO 1';
 if(scene==='fort2')return 'FORTEZZA VECCHIA · PIANO 2';
 if(scene==='fort3')return 'FORTEZZA VECCHIA · TORRE';
 return 'LIVORNO · CITTÀ';
}
function toast(t,ms=2200){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.style.display='none',ms);}
function setScene(s){scene=s;player.visible=true;document.getElementById('place').textContent=placeName();document.getElementById('hint').textContent=s==='world'?'ESPLORA · AZIONE VICINO AGLI EDIFICI':'ESPLORA · AZIONE PER INTERAGIRE';}
function openDialog(title,lines){dialogQueue=lines;dialogPos=0;document.getElementById('dialogTitle').textContent=title;document.getElementById('dialogText').textContent=lines[0];document.getElementById('dialog').style.display='block';}
document.getElementById('dialogNext').onclick=()=>{dialogPos++;if(dialogPos>=dialogQueue.length){document.getElementById('dialog').style.display='none'}else document.getElementById('dialogText').textContent=dialogQueue[dialogPos]};

function collidesWorld(nx,ny){
 const r=10;
 if(nx<r||ny<r||nx>MAPW*TILE-r||ny>MAPH*TILE-r)return true;
 for(const o of objects){
  const pad=4;
  const x=o.x*TILE-pad,y=o.y*TILE-pad,w=o.w*TILE+pad*2,h=o.h*TILE+pad*2;
  if(nx+r>x&&nx-r<x+w&&ny+r>y&&ny-r<y+h)return true;
 }
 for(const p of npcs)if(Math.hypot(nx-p.x*TILE-TILE/2,ny-p.y*TILE-TILE/2)<26)return true;
 return false;
}
function collidesInterior(nx,ny){
 const min=2*TILE,maxX=16*TILE,maxY=13*TILE;
 if(nx<min||nx>maxX||ny<min||ny>maxY)return true;
 return false;
}
function move(dt){
 if(!player.visible)return;
 const len=Math.hypot(keys.x,keys.y); if(len<.01)return;
 const vx=keys.x/Math.max(1,len)*player.speed*dt,vy=keys.y/Math.max(1,len)*player.speed*dt;
 player.face=Math.abs(keys.x)>Math.abs(keys.y)?(keys.x>0?'right':'left'):(keys.y>0?'down':'up');
 if(scene==='world'){let nx=player.x+vx;if(!collidesWorld(nx,player.y))player.x=nx;let ny=player.y+vy;if(!collidesWorld(player.x,ny))player.y=ny}
 else {let nx=player.x+vx;if(!collidesInterior(nx,player.y))player.x=nx;let ny=player.y+vy;if(!collidesInterior(player.x,ny))player.y=ny}
}
function nearest(list,dist=70){
 let best=null,bd=dist;
 for(const a of list){const d=Math.hypot(player.x-(a.x*TILE+TILE/2),player.y-(a.y*TILE+TILE/2));if(d<bd){best=a;bd=d}}
 return best;
}
function action(){
 if(scene==='house'){
  if(player.y>10.2*TILE && player.y<12.2*TILE && Math.abs(player.x-(9*TILE+24))<90){
   setScene('world');player.x=returnDoor.x*TILE+24;player.y=(returnDoor.y+1)*TILE+8;player.visible=true;toast('Sei fuori casa. Ora puoi proseguire.');return;
  }
  toast('La porta è in fondo alla stanza.');return;
 }
 if(scene==='world'){
  const o=nearest(objects,82);
  if(o){
   if(o.type==='lab'){setScene('lab');player.x=9*TILE;player.y=11*TILE;toast('Laboratorio del Professor Elio');return}
   if(o.type==='fort'){setScene('fort1');player.x=9*TILE;player.y=12*TILE;toast('Entri nella Fortezza Vecchia.');return}
   if(o.type==='house'){returnDoor=o.door;setScene('house');player.x=9*TILE;player.y=11*TILE;player.visible=true;toast('Entri nella casa.');return}
  }
  const n=nearest(npcs,70);if(n){openDialog(n.name,[n.line, '«Ogni allenatore ha il proprio modo di crescere i Prismic.»']);return}
  const w=nearest(wild.map(z=>({x:z.x,y:z.y,...z})),65);
  if(w){startBattle(w);return}
  toast('Nessuna interazione qui.');
  return;
 }
 if(scene==='lab'){
  if(player.y>12*TILE){setScene('world');player.x=8*TILE;player.y=4*TILE;toast('Esci dal laboratorio.');return}
  openDialog('Professor Elio',[
   '«Benvenuto. Questo mondo è abitato dai Prismic: creature legate a elementi, ambienti e persone.»',
   '«I Prismic possono combattere, crescere e imparare più mosse. Quando ne incontri uno selvatico puoi indebolirlo e catturarlo con un prisma.»',
   '«Per iniziare, scegli Aurelio: sarà il tuo primo compagno.»'
  ]);return;
 }
 if(scene==='fort1'||scene==='fort2'||scene==='fort3'){
  if(player.y>12*TILE){if(scene==='fort1')setScene('world');else setScene(scene==='fort3'?'fort2':'fort1');player.x=9*TILE;player.y=11*TILE;toast('Scendi le scale.');return}
  const floor=scene==='fort1'?'Piano 1':scene==='fort2'?'Piano 2':'Torre';
  openDialog('Fortezza Vecchia',[`«${floor}: vecchie pietre, visitatori e Prismic arrivati da lontano.»`,'«Alcuni turisti combattono per allenamento. I loro Prismic non possono essere catturati.»']);return;
 }
}

function startBattle(w){
 const s=species[w.id], p=team.find(t=>t.hp>0);
 if(!p){toast('Tutti i tuoi Prismic sono esausti.');return}
 battle={wild:w,enemy:{...s,hp:s.max,max:s.max,level:w.level},player:p};
 encountered.add(w.id);
 document.getElementById('battle').style.display='block';renderBattle();
}
function renderBattle(){
 const b=battle;if(!b)return;
 document.getElementById('enemyName').textContent=b.enemy.name;
 document.getElementById('enemyType').textContent=`${b.enemy.type} · Lv.${b.enemy.level}`;
 document.getElementById('playerName').textContent=b.player.name;
 document.getElementById('playerType').textContent=`${b.player.type} · Lv.${b.player.level}`;
 document.getElementById('enemyHP').style.width=Math.max(0,b.enemy.hp/b.enemy.max*100)+'%';
 document.getElementById('playerHP').style.width=Math.max(0,b.player.hp/b.player.max*100)+'%';
 document.getElementById('enemySprite').textContent=b.enemy.emoji;
 document.getElementById('playerSprite').textContent=species[b.player.name]?.emoji||'◇';
 const moves=b.player.moves||[['Colpo',6],['Tecnica',8]];
 document.getElementById('moves').innerHTML=moves.map((m,i)=>`<button class="move" data-m="${i}">${m[0]}<br><span class="small">${b.player.type} · ${m[1]} pot.</span></button>`).join('');
 document.querySelectorAll('[data-m]').forEach(btn=>btn.onclick=()=>useMove(+btn.dataset.m));
}
function useMove(i){
 if(!battle)return;
 const m=(battle.player.moves||[['Colpo',6],['Tecnica',8]])[i]||['Colpo',6];
 const dmg=Math.max(1,Math.floor(m[1]+battle.player.level*1.4-battle.enemy.level*.5));
 battle.enemy.hp=Math.max(0,battle.enemy.hp-dmg);
 document.getElementById('battleLog').textContent=`${battle.player.name} usa ${m[0]}: -${dmg} HP.`;
 if(battle.enemy.hp<=0){
  battle.player.xp=(battle.player.xp||0)+Math.max(10,battle.enemy.level*8);
  if(battle.player.xp>=(battle.player.xpNext||30)){battle.player.xp=0;battle.player.xpNext=(battle.player.xpNext||30)+15;battle.player.level++;battle.player.max+=4;battle.player.hp=battle.player.max;toast(`${battle.player.name} è salito al livello ${battle.player.level}!`)}
  battle.wild.caught=true;
  if(team.findIndex(x=>x.name===battle.enemy.name)<0 && team.length<6)team.push({...species[battle.enemy.name],hp:species[battle.enemy.name].max,max:species[battle.enemy.name].max,level:battle.enemy.level,xp:0,xpNext:30,moves:[['Azione',6],['Tecnica',8]]});
  document.getElementById('battleLog').textContent+=` ${battle.enemy.name} è esausto.`;
  setTimeout(()=>{document.getElementById('battle').style.display='none';battle=null;renderMenu();},900);
  return;
 }
 setTimeout(()=>{
  if(!battle)return;
  const edmg=Math.max(1,Math.floor(5+battle.enemy.level-battle.player.level*.4));
  battle.player.hp=Math.max(0,battle.player.hp-edmg);
  document.getElementById('battleLog').textContent+=` ${battle.enemy.name} reagisce: -${edmg} HP.`;
  if(battle.player.hp<=0){
   battle.player.hp=0;toast(`${battle.player.name} è esausto!`);
   const next=team.find(t=>t.hp>0);
   if(next){battle.player=next;document.getElementById('battleLog').textContent+=' Sostituzione automatica.';renderBattle()}
   else {document.getElementById('battle').style.display='none';battle=null}
  }else renderBattle();
 },450);
}
function renderMenu(){
 document.getElementById('count').textContent=team.length;
 document.getElementById('teamCount').textContent=`${team.length}/6`;
 document.getElementById('dexCount').textContent=`${encountered.size}/${Object.keys(species).length}`;
 document.getElementById('teamList').innerHTML=team.map(t=>`<div class="mon"><div class="sprite">${species[t.name]?.emoji||'◇'}</div><b>${t.name}</b><div class="badge">${t.type}</div><div>Lv.${t.level} · HP ${t.hp}/${t.max}</div></div>`).join('');
 document.getElementById('dexList').innerHTML=Object.entries(species).map(([id,s])=>{const seen=encountered.has(id);return `<div class="mon"><div class="sprite">${seen?s.emoji:'?'}</div><b>${seen?s.name:'?????'}</b><div class="badge">${seen?s.type:'NON SCOPERTO'}</div></div>`}).join('');
}
document.getElementById('mBtn').onclick=()=>{renderMenu();document.getElementById('menu').style.display='block'};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).style.display='none');
document.getElementById('aBtn').onclick=action;

let joy={active:false,id:null,cx:0,cy:0};
const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');
function joyStart(e){const p=e.changedTouches?e.changedTouches[0]:e;joy.active=true;joy.id=e.pointerId??null;const r=joyEl.getBoundingClientRect();joy.cx=r.left+r.width/2;joy.cy=r.top+r.height/2;joyMove(e);e.preventDefault()}
function joyMove(e){if(!joy.active)return;const p=e.touches?e.touches[0]:e;let dx=p.clientX-joy.cx,dy=p.clientY-joy.cy;const max=50,l=Math.hypot(dx,dy);if(l>max){dx=dx/l*max;dy=dy/l*max}knob.style.transform=`translate(${dx}px,${dy}px)`;keys.x=dx/max;keys.y=dy/max;e.preventDefault()}
function joyEnd(){joy.active=false;keys.x=0;keys.y=0;knob.style.transform='translate(0,0)'}
joyEl.addEventListener('pointerdown',joyStart);addEventListener('pointermove',joyMove,{passive:false});addEventListener('pointerup',joyEnd);addEventListener('pointercancel',joyEnd);
addEventListener('keydown',e=>{if(e.key==='ArrowUp')keys.y=-1;if(e.key==='ArrowDown')keys.y=1;if(e.key==='ArrowLeft')keys.x=-1;if(e.key==='ArrowRight')keys.x=1;if(e.key===' ')action();if(e.key==='m')document.getElementById('mBtn').click()});
addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown'].includes(e.key))keys.y=0;if(['ArrowLeft','ArrowRight'].includes(e.key))keys.x=0});

function isoPoint(x,y,z=0){
 const ox=W/2,oy=H*.38;
 return [ox+(x-y)*TILE*.52,oy+(x+y)*TILE*.26-z];
}
function poly(points,fill,stroke='#39433f',lw=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function cube(x,y,w,h,wall='#d4a981',roof='#615966'){
 const [bx,by]=isoPoint(x,y);
 const sx=TILE*.52*w,sy=TILE*.26*w;
 poly([[bx,by],[bx+sx,by+sy],[bx+sx,by+sy+TILE*h*.52],[bx,by+TILE*h*.52]],wall);
 poly([[bx,by],[bx-sx,by+sy],[bx-sx,by+sy+TILE*h*.52],[bx,by+TILE*h*.52]],'#c79a79');
 const z=TILE*h*.52;
 poly([[bx,by-z*.18],[bx+sx,by+sy-z*.18],[bx,by+2*sy-z*.18],[bx-sx,by+sy-z*.18]],roof);
}
function tree3d(x,y){
 const [bx,by]=isoPoint(x,y);
 ctx.fillStyle='#5c4938';ctx.fillRect(bx-5,by-32,10,35);
 poly([[bx,by-66],[bx+19,by-38],[bx+8,by-20],[bx-16,by-31]],'#356a4a');
 poly([[bx,by-79],[bx+22,by-50],[bx+5,by-36],[bx-22,by-50]],'#447b4d');
}
function drawGround(){
 ctx.fillStyle='#91b67d';ctx.fillRect(0,0,W,H);
 for(let y=0;y<MAPH;y++)for(let x=0;x<MAPW;x++){
  let c=colors.grass;
  if(y>=11)c=colors.road;
  if(x>=15&&y<9)c=colors.water;
  if(y===10&&x>=12)c=colors.sand;
  const [bx,by]=isoPoint(x,y);
  poly([[bx,by],[bx+TILE*.52,by+TILE*.26],[bx,by+TILE*.52],[bx-TILE*.52,by+TILE*.26]],c,null);
 }
 // path stripes / water highlights
 ctx.globalAlpha=.16;ctx.strokeStyle='#fff';
 for(let i=0;i<12;i++){const [x,y]=isoPoint(15+i*.15,3+i*.55);ctx.beginPath();ctx.moveTo(x-12,y);ctx.lineTo(x+10,y+5);ctx.stroke()}
 ctx.globalAlpha=1;
}
function drawWorld(){
 drawGround();
 // buildings first, then vegetation and actors by depth
 for(const o of objects){
  if(o.type==='fort')cube(o.x,o.y,3,2.7,'#9d9488','#4e4b52');
  else if(o.type==='lab')cube(o.x,o.y,3,1.9,'#d6b08d','#5a5965');
  else cube(o.x,o.y,o.w,1.5,'#d8ad86','#625d68');
 }
 for(const t of [[1,6],[3,4],[9,6],[14,8],[16,12],[6,13]])tree3d(t[0],t[1]);
 for(const w of wild){const s=species[w.id];drawCreature(w.x,w.y,s.emoji)}
 for(const n of npcs)drawPerson3d(n.x,n.y,n.name);
 drawPlayer3d();
}
function drawInterior(){
 ctx.fillStyle='#b9a58b';ctx.fillRect(0,0,W,H);
 // faux 3D room
 poly([[80,90],[W-80,90],[W-25,H-130],[25,H-130]],'#dfd2ba','#4a4742',2);
 poly([[80,90],[W/2,145],[W-80,90]],'#8b7d6d','#4a4742',2);
 poly([[25,H-130],[W/2,H-70],[W-25,H-130]],'#9e8d74','#4a4742',2);
 // furniture
 for(const q of [[120,180],[W-160,190]]){ctx.fillStyle='#7a563e';ctx.fillRect(q[0],q[1],70,38);ctx.fillStyle='#b58a61';ctx.fillRect(q[0]+7,q[1]-10,56,14)}
 ctx.fillStyle='#6e4b3a';ctx.fillRect(W/2-26,H-150,52,80);
 drawPlayer3d(9,9);
}
function drawLab(){
 drawInterior();
 ctx.fillStyle='#51636a';ctx.fillRect(W/2-150,190,300,34);
 for(let i=0;i<5;i++){ctx.fillStyle='#a8c7b8';ctx.fillRect(W/2-135+i*58,150,35,40)}
 ctx.fillStyle='#f2e9d2';ctx.font='bold 16px Georgia';ctx.textAlign='center';ctx.fillText('LABORATORIO DEL PROF. ELIO',W/2,120);
 drawPerson3d(10,7,'ELIO');
}
function drawFort(){
 drawInterior();
 ctx.fillStyle='#77726c';for(let i=0;i<7;i++){ctx.fillRect(75+i*80,140,62,150)}
 ctx.fillStyle='#4f4b49';ctx.fillRect(85,300,140,18);ctx.fillRect(W-225,300,140,18);
 ctx.fillStyle='#efe5d0';ctx.font='bold 17px Georgia';ctx.textAlign='center';ctx.fillText(placeName(),W/2,115);
 for(let i=0;i<3;i++)drawPerson3d(5+i*4,7,'Turista');
 drawPlayer3d(9,9);
}
function drawPerson3d(x,y,name){
 const [bx,by]=isoPoint(x,y,0);ctx.fillStyle='#3b302c';ctx.fillRect(bx-5,by-34,10,28);
 ctx.fillStyle=name==='ELIO'?'#d5d8dc':'#d8b08d';ctx.beginPath();ctx.arc(bx,by-48,10,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#333';ctx.stroke();
 ctx.fillStyle=name==='ELIO'?'#58788d':'#4d596d';ctx.fillRect(bx-12,by-38,24,25);
 ctx.fillStyle='#111';ctx.fillRect(bx-5,by-50,3,3);ctx.fillRect(bx+2,by-50,3,3);
}
function drawCreature(x,y,emoji){
 const [bx,by]=isoPoint(x,y,8);ctx.font='27px sans-serif';ctx.textAlign='center';ctx.fillText(emoji,bx,by);
}
function drawPlayer3d(){
 const [bx,by]=scene==='house'?isoPoint(9,9,0):isoPoint(player.x/TILE,player.y/TILE,0);
 ctx.fillStyle='#243b56';ctx.fillRect(bx-8,by-40,16,18);
 ctx.fillStyle='#e0aa83';ctx.fillRect(bx-9,by-29,18,17);
 ctx.fillStyle='#2d4c78';ctx.fillRect(bx-11,by-18,22,23);
 ctx.fillStyle='#f2f2e8';ctx.fillRect(bx-7,by-12,14,8);
 ctx.fillStyle='#20252a';ctx.fillRect(bx-7,by+5,5,5);ctx.fillRect(bx+2,by+5,5,5);
}
function draw(){
 ctx.clearRect(0,0,W,H);
 if(scene==='world')drawWorld(); else if(scene==='lab')drawLab(); else if(scene.startsWith('fort'))drawFort(); else drawInterior();
 document.getElementById('place').textContent=placeName();
}
let last=performance.now();
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;move(dt);draw();requestAnimationFrame(loop)}
loop(last);
renderMenu();
toast('Demo 0.9 · nuova visuale 3D',1800);
</script>
</body></html>
