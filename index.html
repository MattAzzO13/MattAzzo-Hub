<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d1c17">
<title>PRISMA — Livorno: Città 01</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d1c17;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.badge{background:rgba(8,15,25,.88);border:2px solid #8b99ad;border-radius:16px;padding:9px 13px;color:#fff;font-weight:800;letter-spacing:.5px;box-shadow:0 4px 16px #0005}
#zone{font-size:14px}.small{font-size:12px;opacity:.78;margin-top:2px}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:142px;max-width:min(88vw,560px);background:rgba(7,12,20,.92);border:2px solid #8b99ad;color:#fff;border-radius:15px;padding:12px 16px;text-align:center;font-weight:700;line-height:1.25;opacity:0;transition:opacity .15s;z-index:7;pointer-events:none}
#msg.show{opacity:1}
#controls{position:fixed;inset:0;z-index:10;pointer-events:none}
#joy{position:absolute;left:max(22px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));width:166px;height:166px;border-radius:50%;background:rgba(120,130,125,.25);border:3px solid #9ba39f;pointer-events:auto;touch-action:none}
#stick{position:absolute;width:72px;height:72px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;background:#9ba09d;border:3px solid #e4e8e7;box-shadow:0 5px 16px #0005}
.actions{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
button{font:900 15px system-ui,-apple-system,sans-serif;color:#fff;background:#152237;border:3px solid #8996ab;border-radius:24px;min-width:118px;height:66px;box-shadow:0 5px 0 #08101c;touch-action:manipulation}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #08101c}
#ok{position:fixed;right:18px;top:max(72px,calc(env(safe-area-inset-top) + 60px));min-width:92px;height:58px;z-index:11;display:none}
#panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,520px);background:#0b1520f5;color:#fff;border:3px solid #8c99ad;border-radius:22px;padding:22px;z-index:20;display:none;box-shadow:0 18px 50px #0009;text-align:center}
#panel h2{margin:0 0 8px}.creature{font-size:42px;margin:6px}
#panel button{margin-top:12px}
@media (max-width:600px){#joy{width:145px;height:145px}#stick{width:64px;height:64px}button{min-width:104px;height:60px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="badge"><div id="zone">PORTO</div><div class="small">Livorno • Città 01</div></div>
  <div class="badge" id="caught">Prismic: 0/2</div>
</div>

<div id="msg"></div>
<button id="ok">OK</button>

<div id="panel">
  <div id="panelIcon" class="creature">💠</div>
  <h2 id="panelTitle">PRISMA</h2>
  <div id="panelText">Esplora Livorno e avvicinati a un Prismic.</div>
  <button id="closePanel">CONTINUA</button>
</div>

<div id="controls">
  <div id="joy"><div id="stick"></div></div>
  <div class="actions">
    <button id="action">AZIONE</button>
    <button id="prisma">PRISMA</button>
  </div>
</div>

<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const DPR=Math.min(devicePixelRatio||1,2);
function resize(){canvas.width=Math.floor(innerWidth*DPR);canvas.height=Math.floor(innerHeight*DPR);canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

const W=2700,H=900,SEA=210,ROAD=250;
const player={x:330,y:650,r:16,speed:2.75,dx:0,dy:0};
const cam={x:0,y:0};
const keys={};
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

const buildings=[],trees=[],decor=[],colliders=[];
function addBuilding(x,y,w,h,type="house",color="#d9c39b",roof="#8b5744"){buildings.push({x,y,w,h,type,color,roof});colliders.push({x,y,w,h})}
function addTree(x,y){trees.push({x,y});colliders.push({x:x-15,y:y-15,w:30,h:30})}
function addDecor(x,y,t){decor.push({x,y,t})}

function makeCity(){
  // PORTO: west
  for(let i=0;i<8;i++) addBuilding(300+(i%4)*150,390+Math.floor(i/4)*170,105+(i%2)*22,86,"house",["#d7b37e","#c9d0bb","#e7c6a1","#b8c9cf"][i%4],["#7a4c43","#506b58","#87544d","#5a6774"][i%4]);
  addBuilding(920,330,170,210,"porthouse","#d7d2b7","#536a70");
  addBuilding(1110,350,125,160,"house","#e6b980","#9a5c49");
  for(let x=275;x<1220;x+=85)addDecor(x,760,"bollard");
  for(let x=230;x<1280;x+=65)addDecor(x,800,"wave");
  // Piazza della Repubblica: center
  addBuilding(1320,270,125,92,"house","#e3c39e","#7e5546");
  addBuilding(1510,245,150,105,"house","#c8d3bc","#566b5a");
  addBuilding(1710,285,110,90,"house","#e9b98e","#86524b");
  addBuilding(1280,590,130,95,"house","#c5d0d7","#5d6878");
  addBuilding(1510,620,150,100,"house","#e4c6a0","#795248");
  addBuilding(1735,585,120,105,"house","#cbd4b8","#5b705e");
  // Fortezza Vecchia: east
  addBuilding(2150,250,210,170,"fortress","#9c9483","#5e594f");
  addBuilding(2385,285,180,130,"fortress","#aaa18f","#615b52");
  addBuilding(2220,520,150,100,"house","#d9bd99","#7d5248");
  addBuilding(2450,540,125,100,"house","#c7d0bc","#566d5b");
  for(let x=1880;x<2650;x+=120)addTree(x,710-(x%240)/2);
  for(let i=0;i<20;i++) addTree(250+(i*83)%1050,110+((i*67)%110));
  for(let i=0;i<15;i++) addTree(1300+(i*97)%1250,120+((i*53)%105));
  addDecor(620,690,"lamp");addDecor(1280,470,"statue");addDecor(1480,470,"fountain");addDecor(1810,465,"statue");
}
makeCity();

const zones=[
 {name:"PORTO",x1:0,x2:1200},
 {name:"PIAZZA DELLA REPUBBLICA",x1:1200,x2:1900},
 {name:"FORTEZZA VECCHIA",x1:1900,x2:2700}
];

const prisms=[
 {id:"Aqua",name:"Marell",type:"ACQUA",x:790,y:620,color:"#57c9e8",accent:"#d9fbff",emoji:"💧",caught:false, bob:0},
 {id:"Erba",name:"Verdin",type:"ERBA",x:1770,y:500,color:"#6bc66f",accent:"#e8ffd2",emoji:"🌿",caught:false,bob:1.4}
];

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function hitCircleRect(cx,cy,r,b){
  const nx=clamp(cx,b.x,b.x+b.w), ny=clamp(cy,b.y,b.y+b.h);
  const dx=cx-nx,dy=cy-ny; return dx*dx+dy*dy<r*r;
}
function blocked(x,y){
  if(y<SEA+18) return true;
  for(const b of colliders) if(hitCircleRect(x,y,player.r,b)) return true;
  return false;
}
function move(dx,dy){
  let nx=player.x+dx,ny=player.y+dy;
  nx=clamp(nx,28,W-28); ny=clamp(ny,SEA+30,H-28);
  if(!blocked(nx,player.y))player.x=nx;
  if(!blocked(player.x,ny))player.y=ny;
}
function zoneName(){
  const z=zones.find(z=>player.x>=z.x1&&player.x<z.x2); return z?z.name:"LIVORNO";
}
function say(t,ms=1800){const m=document.getElementById("msg");m.textContent=t;m.classList.add("show");clearTimeout(say.t);say.t=setTimeout(()=>m.classList.remove("show"),ms)}
function nearestPrism(){
  let best=null,bd=1e9;
  for(const p of prisms){if(p.caught)continue;const d=Math.hypot(player.x-p.x,player.y-p.y);if(d<bd){bd=d;best=p}}
  return {p:best,d:bd};
}
function catchPrism(){
  const n=nearestPrism();
  if(!n.p){say("Hai già catturato tutti i Prismic!");return}
  if(n.d>105){say("Avvicinati a un Prismic per usare PRISMA.");return}
  n.p.caught=true;
  document.getElementById("caught").textContent=`Prismic: ${prisms.filter(p=>p.caught).length}/2`;
  document.getElementById("panelIcon").textContent=n.p.emoji;
  document.getElementById("panelTitle").textContent=`${n.p.name} • ${n.p.type}`;
  document.getElementById("panelText").textContent=`Hai catturato ${n.p.name}, un Prismic di elemento ${n.p.type.toLowerCase()}. Puoi continuare a esplorare Livorno.`;
  document.getElementById("panel").style.display="block";
}
function action(){
  const n=nearestPrism();
  if(n.p&&n.d<150){say(`${n.p.name}: Prismic ${n.p.type}. Premi PRISMA per catturarlo.`);return}
  if(player.x>1240&&player.x<1870&&player.y>390&&player.y<550){say("Piazza della Repubblica: una grande piazza-ponte nel cuore della città.");return}
  if(player.x>2050&&player.y<700){say("Fortezza Vecchia: mura, torri e vista sul porto.");return}
  if(player.y>SEA+20&&player.x<1250){say("Porto di Livorno: moli, acqua e case colorate.");return}
  say("Esplora la città. Cerca i due Prismic!");
}
function setButton(el,fn){
  const go=e=>{e.preventDefault();fn(e)};
  el.addEventListener("pointerdown",go,{passive:false});
  el.addEventListener("touchstart",go,{passive:false});
  el.addEventListener("click",go,{passive:false});
}
setButton(document.getElementById("prisma"),catchPrism);
setButton(document.getElementById("action"),action);
setButton(document.getElementById("closePanel"),()=>document.getElementById("panel").style.display="none");

const joy=document.getElementById("joy"),stick=document.getElementById("stick"),jstate={active:false,x:0,y:0};
function joySet(cx,cy){
 const r=joy.getBoundingClientRect(),mx=r.left+r.width/2,my=r.top+r.height/2;
 let x=cx-mx,y=cy-my,d=Math.hypot(x,y),max=r.width*.30;
 if(d>max){x=x/d*max;y=y/d*max}
 jstate.x=x/max;jstate.y=y/max;
 stick.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px))`;
}
function joyReset(){jstate.active=false;jstate.x=jstate.y=0;stick.style.transform="translate(-50%,-50%)"}
joy.addEventListener("pointerdown",e=>{e.preventDefault();jstate.active=true;joySet(e.clientX,e.clientY)},{passive:false});
joy.addEventListener("pointermove",e=>{if(jstate.active){e.preventDefault();joySet(e.clientX,e.clientY)}},{passive:false});
joy.addEventListener("pointerup",e=>{e.preventDefault();joyReset()},{passive:false});
joy.addEventListener("pointercancel",joyReset);
joy.addEventListener("touchstart",e=>{e.preventDefault();jstate.active=true;const t=e.touches[0];joySet(t.clientX,t.clientY)},{passive:false});
joy.addEventListener("touchmove",e=>{if(jstate.active){e.preventDefault();const t=e.touches[0];joySet(t.clientX,t.clientY)}},{passive:false});
joy.addEventListener("touchend",e=>{e.preventDefault();joyReset()},{passive:false});

function drawHouse(b){
  ctx.fillStyle="#0003";ctx.fillRect(b.x+7,b.y+8,b.w,b.h);
  ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y+18,b.w,b.h-18);
  ctx.fillStyle=b.roof;
  if(b.type==="fortress"){ctx.fillRect(b.x,b.y,b.w,b.h*.23);for(let x=b.x;x<b.x+b.w;x+=34)ctx.fillRect(x,b.y-8,20,12)}
  else{ctx.beginPath();ctx.moveTo(b.x-8,b.y+24);ctx.lineTo(b.x+b.w/2,b.y-20);ctx.lineTo(b.x+b.w+8,b.y+24);ctx.closePath();ctx.fill()}
  ctx.fillStyle="#fff8";ctx.fillRect(b.x+b.w*.18,b.y+38,24,22);ctx.fillRect(b.x+b.w*.64,b.y+38,24,22);
  ctx.fillStyle="#6b4b35";ctx.fillRect(b.x+b.w*.42,b.y+b.h-38,28,38);
}
function draw(){
 const vw=innerWidth,vh=innerHeight;
 ctx.clearRect(0,0,vw,vh);
 cam.x=clamp(player.x-vw*.5,0,W-vw);cam.y=clamp(player.y-vh*.5,0,H-vh);
 ctx.save();ctx.translate(-cam.x,-cam.y);
 // sea
 ctx.fillStyle="#4b9eae";ctx.fillRect(0,0,W,SEA);
 for(let x=0;x<W;x+=90){ctx.strokeStyle="#b5e3e3aa";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,42+(x%70));ctx.quadraticCurveTo(x+22,32+(x%70),x+45,42+(x%70));ctx.stroke()}
 // land
 ctx.fillStyle="#b8a77e";ctx.fillRect(0,SEA,W,H-SEA);
 // roads / areas
 ctx.fillStyle="#b7b0a2";ctx.fillRect(0,540,W,145);
 ctx.fillStyle="#c4bdaf";ctx.fillRect(1190,SEA,80,H-SEA);ctx.fillRect(1880,SEA,85,H-SEA);
 // plaza
 ctx.fillStyle="#cfc9bc";ctx.beginPath();ctx.ellipse(1535,485,320,170,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#9e988d";ctx.lineWidth=5;ctx.stroke();
 // port piers
 ctx.fillStyle="#705d4e";ctx.fillRect(0,SEA+50,790,34);ctx.fillRect(520,SEA+50,35,260);ctx.fillRect(690,SEA+50,35,260);
 // fortress water moat / walls
 ctx.fillStyle="#6f6557";ctx.fillRect(2050,205,560,32);ctx.fillRect(2050,205,32,390);ctx.fillRect(2578,205,32,390);
 for(const b of buildings)drawHouse(b);
 // fountain and statue
 for(const d of decor){
   if(d.t==="fountain"){ctx.fillStyle="#8799a2";ctx.beginPath();ctx.arc(d.x,d.y,38,0,Math.PI*2);ctx.fill();ctx.fillStyle="#5b9fb1";ctx.beginPath();ctx.arc(d.x,d.y,25,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#d7f0ee";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(d.x,d.y-28);ctx.lineTo(d.x,d.y-65);ctx.stroke()}
   if(d.t==="statue"){ctx.fillStyle="#77766e";ctx.fillRect(d.x-8,d.y-35,16,35);ctx.beginPath();ctx.arc(d.x,d.y-48,12,0,Math.PI*2);ctx.fill()}
   if(d.t==="lamp"){ctx.fillStyle="#4d4b45";ctx.fillRect(d.x-3,d.y-35,6,35);ctx.fillStyle="#ffe6a6";ctx.beginPath();ctx.arc(d.x,d.y-40,9,0,Math.PI*2);ctx.fill()}
   if(d.t==="bollard"){ctx.fillStyle="#574e45";ctx.fillRect(d.x-5,d.y-12,10,20)}
   if(d.t==="wave"){ctx.strokeStyle="#7bb7bd";ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+35,d.y);ctx.stroke()}
 }
 for(const t of trees){ctx.fillStyle="#594f3d";ctx.fillRect(t.x-4,t.y,8,20);ctx.fillStyle="#4e815c";ctx.beginPath();ctx.arc(t.x,t.y-5,22,0,Math.PI*2);ctx.fill();ctx.fillStyle="#6b9866";ctx.beginPath();ctx.arc(t.x-9,t.y-11,12,0,Math.PI*2);ctx.fill()}
 // zone signs
 ctx.font="900 26px system-ui";ctx.fillStyle="#fff8";ctx.fillText("PORTO",410,315);ctx.fillText("PIAZZA DELLA REPUBBLICA",1330,190);ctx.fillText("FORTEZZA VECCHIA",2160,170);
 // Prismic sprites
 for(const p of prisms){
   if(p.caught)continue;
   p.bob+=.045;const yy=p.y+Math.sin(p.bob)*5;
   ctx.save();ctx.translate(p.x,yy);
   ctx.fillStyle="#0003";ctx.beginPath();ctx.ellipse(0,25,28,9,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle=p.color;ctx.strokeStyle=p.accent;ctx.lineWidth=4;
   if(p.type==="ACQUA"){
     ctx.beginPath();ctx.moveTo(0,-34);ctx.quadraticCurveTo(38,-2,0,35);ctx.quadraticCurveTo(-38,-2,0,-34);ctx.fill();ctx.stroke();
     ctx.fillStyle="#0e4960";ctx.beginPath();ctx.arc(-10,-4,4,0,Math.PI*2);ctx.arc(10,-4,4,0,Math.PI*2);ctx.fill();
     ctx.strokeStyle="#0e4960";ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,4,10,0,Math.PI);ctx.stroke();
   }else{
     ctx.beginPath();ctx.ellipse(0,2,30,31,0,0,Math.PI*2);ctx.fill();ctx.stroke();
     ctx.fillStyle=p.accent;ctx.beginPath();ctx.ellipse(-18,-25,10,22,-.5,0,Math.PI*2);ctx.ellipse(18,-25,10,22,.5,0,Math.PI*2);ctx.fill();
     ctx.fillStyle="#245d34";ctx.beginPath();ctx.arc(-10,-3,4,0,Math.PI*2);ctx.arc(10,-3,4,0,Math.PI*2);ctx.fill();
   }
   ctx.font="bold 14px system-ui";ctx.textAlign="center";ctx.fillStyle="#fff";ctx.fillText(p.name,0,57);
   ctx.restore();
 }
 // player
 ctx.fillStyle="#0004";ctx.beginPath();ctx.ellipse(player.x,player.y+20,20,8,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#2d4f80";ctx.fillRect(player.x-12,player.y-3,24,25);
 ctx.fillStyle="#e7b58f";ctx.beginPath();ctx.arc(player.x,player.y-13,12,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#20304a";ctx.fillRect(player.x-13,player.y-25,26,8);
 ctx.fillStyle="#f4f4f0";ctx.fillRect(player.x-9,player.y+3,18,12);
 ctx.restore();
 document.getElementById("zone").textContent=zoneName();
}
let last=performance.now();
function loop(now){
 const dt=Math.min(32,now-last)/16.67;last=now;
 let dx=jstate.x,dy=jstate.y;
 if(keys.arrowleft||keys.a)dx-=1;if(keys.arrowright||keys.d)dx+=1;
 if(keys.arrowup||keys.w)dy-=1;if(keys.arrowdown||keys.s)dy+=1;
 const len=Math.hypot(dx,dy);if(len>1){dx/=len;dy/=len}
 if(Math.hypot(dx,dy)>.08)move(dx*player.speed*dt,dy*player.speed*dt);
 draw();requestAnimationFrame(loop)
}
say("Benvenuto a Livorno. Esplora le 3 aree e cerca i due Prismic!",2600);
requestAnimationFrame(loop);
</script>
</body>
</html>
