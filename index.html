<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PRISMA — Demo Pixel</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;touch-action:none;font-family:system-ui,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;width:min(100vw,calc(100vh * 10 / 9));height:min(100vh,calc(100vw * 9 / 10));background:#fff}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#fff}
  #touch{position:absolute;inset:0;pointer-events:none}
  #joy{position:absolute;left:5%;bottom:7%;width:29%;aspect-ratio:1;border:2px solid rgba(30,30,30,.35);border-radius:50%;background:rgba(255,255,255,.12);pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:#b9b9b9;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.35)}
  #menuBtn,#actBtn{position:absolute;right:5%;width:22%;height:12%;border:2px solid #202020;border-radius:10px;background:#f7f7f7;box-shadow:0 3px 0 rgba(0,0,0,.35);font-weight:800;font-size:clamp(10px,2.5vw,18px);pointer-events:auto;touch-action:none}
  #actBtn{bottom:8%} #menuBtn{bottom:22%}
  #hint{position:absolute;top:3%;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);border:2px solid #202020;padding:5px 9px;font-size:10px;font-weight:800;opacity:0;transition:.2s;pointer-events:none}
  #dialog{position:absolute;left:5%;right:5%;bottom:2%;padding:9px;background:#fff;border:3px solid #202020;box-shadow:4px 4px 0 #8b72c7;display:none;font-size:12px;line-height:1.25}
  #dialog b{display:block;margin-bottom:4px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game" width="160" height="144"></canvas>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <button id="menuBtn">MENU</button>
  <button id="actBtn">AZIONE</button>
  <div id="hint"></div>
  <div id="dialog"></div>
</div>
</div>
<script>
"use strict";

/* PRISMA pixel demo:
   - internal resolution 160x144, scaled with nearest-neighbour
   - no external images/assets
   - pointer events are captured on the joystick so Safari cannot lose the touch
   - movement is driven every animation frame by joystick vector, not by touch coordinates
*/

const C=document.getElementById("game"), ctx=C.getContext("2d",{alpha:false});
ctx.imageSmoothingEnabled=false;
const W=160,H=144;

const pal={
 ink:"#151515", white:"#fff", lavender:"#b77cff", purple:"#8e5bd3",
 blue:"#4fc7f4", cyan:"#6fe4ff", darkBlue:"#267aa0",
 grass:"#fefefe", grass2:"#f5f1ff", water:"#9deaff",
 green:"#79c8b1", roof:"#a875df", roof2:"#c58cff",
 skin:"#ffd8b0", hair:"#222", shirt:"#8b5bd2", pants:"#27244d",
 sand:"#f7f4ff", shadow:"#c9b8dc", black:"#151515"
};

let scene="town";
let player={x:80,y:72,dir:"down",speed:48,visible:true};
let joy={x:0,y:0,active:false,id:null};
let keys={};
let message="";
let dialogOpen=false;
let menuOpen=false;

const town={
  houses:[
    {x:7,y:6,w:48,h:43,door:{x:26,y:42},name:"Casa"},
    {x:122,y:6,w:31,h:43,door:{x:137,y:42},name:"Casa"},
    {x:94,y:86,w:58,h:51,door:{x:123,y:127},name:"Casa"},
  ],
  kiosk:{x:108,y:39,w:15,h:16},
  sign:{x:4,y:108,w:6,h:12},
  water:{x:0,y:124,w:160,h:20},
  flowers:{x:0,y:104,w:48,h:20}
};

const npcs=[
  {x:70,y:71,kind:"eli",name:"Professor Elio",text:"Il mondo Prismic e' pieno di creature. Trova i Prismi e impara a conoscerle!"},
  {x:82,y:72,kind:"prismic",name:"Luminello",text:"Luminello sembra curioso."},
  {x:113,y:67,kind:"person",name:"Viandante",text:"Le case della citta' nascondono sempre qualcosa."}
];

function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(x,y,w,h)}
function px(x,y,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),1,1)}
function outlineRect(x,y,w,h,fill,stroke=pal.ink){
  rect(x,y,w,h,stroke); rect(x+1,y+1,w-2,h-2,fill);
}
function line(x1,y1,x2,y2,col){ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1+.5,y1+.5);ctx.lineTo(x2+.5,y2+.5);ctx.stroke()}

function drawTown(){
  ctx.fillStyle=pal.white;ctx.fillRect(0,0,W,H);

  // subtle lavender ground pixels
  for(let y=0;y<124;y+=4) for(let x=(y%8);x<W;x+=12){
    if(((x*7+y*3)%17)<5) px(x,y,pal.lavender);
  }

  // water
  for(let y=124;y<H;y++){
    for(let x=0;x<W;x+=3){
      px(x+((y*5)%3),y,(y%2?pal.cyan:pal.water));
    }
  }
  for(let x=0;x<W;x+=8) line(x,127,x+3,127,pal.blue);

  // flowers/grass patch
  for(let y=104;y<124;y+=3) for(let x=0;x<48;x+=3){
    if(((x*11+y*7)%13)<7){px(x,y,pal.lavender);px(x+1,y,pal.blue)}
  }
  for(let x=4;x<46;x+=7){
    outlineRect(x,106,4,16,pal.white);
    rect(x+1,108,2,11,pal.blue);
  }

  // sign
  outlineRect(4,108,8,13,pal.white);
  rect(5,109,6,1,pal.blue); rect(6,112,4,2,pal.cyan); rect(6,115,4,2,pal.blue);

  // houses
  town.houses.forEach(drawHouse);

  // kiosk
  outlineRect(town.kiosk.x,town.kiosk.y,town.kiosk.w,town.kiosk.h,pal.white);
  rect(109,42,13,2,pal.blue); rect(111,45,9,6,pal.cyan);
  rect(113,46,5,4,pal.white);

  // NPCs
  drawNPC(npcs[0]); drawPrismic(npcs[1].x,npcs[1].y); drawNPC(npcs[2]);

  drawPlayer();
}

function drawHouse(h){
  const {x,y,w}=h;
  // shadow
  rect(x+4,y+38,w,4,pal.shadow);
  // roof, stepped pixel silhouette
  const roofH=19;
  rect(x+7,y+2,w-14,2,pal.ink);
  rect(x+4,y+4,w-8,2,pal.ink);
  rect(x+2,y+6,w-4,2,pal.ink);
  rect(x,y+8,w,12,pal.ink);
  rect(x+2,y+8,w-4,10,pal.roof);
  rect(x+5,y+5,w-10,2,pal.roof2);
  rect(x+8,y+3,w-16,2,pal.roof2);
  // roof highlights
  for(let xx=x+4;xx<x+w-4;xx+=7) rect(xx,y+10,2,7,pal.lavender);
  rect(x+2,y+18,w-4,3,pal.purple);

  // walls
  rect(x+4,y+20,w-8,22,pal.ink);
  rect(x+6,y+21,w-12,20,pal.white);
  // wall bands
  rect(x+6,y+31,w-12,2,pal.lavender);
  rect(x+6,y+39,w-12,2,pal.blue);

  // windows
  const winY=y+23;
  for(const wx of [x+10,x+25,x+40]){
    if(wx+8<x+w-5){
      outlineRect(wx,winY,9,8,pal.white);
      rect(wx+1,winY+1,7,5,pal.cyan);
      rect(wx+2,winY+2,5,3,pal.white);
    }
  }
  // door
  const dx=h.door.x-4, dy=h.door.y-7;
  outlineRect(dx,dy,9,13,pal.ink);
  rect(dx+2,dy+2,5,9,pal.blue);
  rect(dx+3,dy+3,3,5,pal.darkBlue);
  rect(dx+5,dy+8,1,1,pal.white);
}

function drawNPC(n){
  const x=Math.round(n.x),y=Math.round(n.y);
  if(n.kind==="eli"){
    // professor
    rect(x-3,y-6,6,3,pal.ink); rect(x-4,y-4,8,6,pal.white);
    rect(x-3,y-3,6,4,pal.skin); rect(x-2,y+1,5,5,pal.white);
    rect(x-3,y+6,3,3,pal.pants); rect(x,y+6,3,3,pal.pants);
    px(x+2,y-2,pal.ink);
  } else {
    rect(x-3,y-6,6,4,pal.hair); rect(x-4,y-4,8,5,pal.skin);
    rect(x-3,y+1,6,6,pal.shirt); rect(x-3,y+7,2,3,pal.pants); rect(x+1,y+7,2,3,pal.pants);
  }
}

function drawPrismic(x,y){
  x=Math.round(x);y=Math.round(y);
  // original creature: small fox/otter-like water Prismic
  rect(x-4,y-3,7,7,pal.ink);
  rect(x-3,y-4,5,7,pal.white);
  rect(x-5,y-2,2,3,pal.ink); rect(x+3,y-2,2,3,pal.ink);
  rect(x-1,y-2,2,2,pal.cyan);
  rect(x+2,y+1,2,2,pal.blue);
  rect(x-4,y+4,2,2,pal.ink); rect(x+1,y+4,2,2,pal.ink);
}

function drawPlayer(){
  if(!player.visible)return;
  const x=Math.round(player.x),y=Math.round(player.y);
  // shadow
  rect(x-4,y+7,8,2,pal.shadow);
  // cap/hair
  rect(x-4,y-7,8,3,pal.ink); rect(x-3,y-9,5,2,pal.ink);
  rect(x-3,y-6,7,5,pal.skin);
  rect(x-2,y-6,5,2,pal.white);
  // body
  rect(x-3,y-1,7,7,pal.ink); rect(x-2,y,pal.ink?5:5,pal.shirt);
  rect(x-2,y+1,5,4,pal.shirt);
  rect(x-3,y+6,3,3,pal.pants); rect(x+1,y+6,3,3,pal.pants);
  // face
  px(x+2,y-4,pal.ink);
}

function drawInterior(){
  ctx.fillStyle=pal.white;ctx.fillRect(0,0,W,H);
  // wall
  rect(0,0,W,34,pal.lavender);
  for(let x=0;x<W;x+=16) rect(x,6,12,2,pal.roof2);
  rect(0,32,W,2,pal.ink);
  // floor
  for(let y=34;y<H;y+=6) for(let x=0;x<W;x+=8){
    rect(x,y,7,5,((x+y)%16===0)?pal.grass2:pal.white);
  }
  // table
  outlineRect(20,42,42,18,pal.roof2);
  rect(24,46,34,10,pal.white);
  // computer
  outlineRect(112,39,25,18,pal.white);
  rect(116,43,17,8,pal.cyan); rect(120,45,9,4,pal.white);
  // exit door
  outlineRect(73,126,15,18,pal.ink);rect(77,129,7,15,pal.blue);
  drawPlayer();
}

function collidesTown(nx,ny){
  // water
  if(ny>120)return true;
  // house bodies and roofs, but doors are walkable
  for(const h of town.houses){
    const bx=h.x+3,by=h.y+3,bw=h.w-6,bh=40;
    const inside=nx>bx-3&&nx<bx+bw+3&&ny>by-3&&ny<by+bh+3;
    const doorX=h.door.x,doorY=h.door.y;
    const atDoor=Math.abs(nx-doorX)<6&&Math.abs(ny-doorY)<6;
    if(inside&&!atDoor)return true;
  }
  // kiosk
  if(nx>106&&nx<124&&ny>36&&ny<57)return true;
  // sign
  if(nx>2&&nx<14&&ny>105&&ny<122)return true;
  // NPCs
  for(const n of npcs){
    if(Math.abs(nx-n.x)<5&&Math.abs(ny-n.y)<5)return true;
  }
  return false;
}

function collidesInterior(nx,ny){
  if(nx<5||nx>155||ny<37||ny>139)return true;
  // furniture
  if(nx>18&&nx<65&&ny>40&&ny<62)return true;
  if(nx>109&&nx<140&&ny>37&&ny<59)return true;
  return false;
}

function nearestDoor(){
  let best=null,bd=99;
  for(const h of town.houses){
    const d=Math.hypot(player.x-h.door.x,player.y-h.door.y);
    if(d<bd){bd=d;best=h}
  }
  return best;
}

function enterHouse(h){
  scene="interior";
  player.visible=true;
  player.x=80;player.y=116;
  message="Sei entrato in "+h.name+".";
  showHint(message);
}

function exitHouse(){
  scene="town";
  player.visible=true;
  // always place just outside the lower central house door to make the transition deterministic
  player.x=town.houses[2].door.x;
  player.y=town.houses[2].door.y+8;
  message="Sei tornato in citta'.";
  showHint(message);
}

function interact(){
  if(scene==="town"){
    const d=nearestDoor();
    if(d && Math.hypot(player.x-d.door.x,player.y-d.door.y)<9){enterHouse(d);return;}
    for(const n of npcs){
      if(Math.hypot(player.x-n.x,player.y-n.y)<10){openDialog(n.name,n.text);return;}
    }
    if(Math.hypot(player.x-7,player.y-114)<10){openDialog("Cartello","Piazza Prismic — centro della citta'.");return;}
    showHint("Nessuna azione qui.");
  }else{
    if(player.y>120){exitHouse();return;}
    openDialog("Casa","Puoi esplorare gli edifici e incontrare gli abitanti.");
  }
}

function move(dt){
  let ax=joy.x,ay=joy.y;
  if(keys.ArrowLeft||keys.a)ax-=1;
  if(keys.ArrowRight||keys.d)ax+=1;
  if(keys.ArrowUp||keys.w)ay-=1;
  if(keys.ArrowDown||keys.s)ay+=1;
  const mag=Math.hypot(ax,ay);
  if(mag<.05)return;
  if(mag>1){ax/=mag;ay/=mag;}
  if(Math.abs(ax)>Math.abs(ay))player.dir=ax<0?"left":"right";
  else player.dir=ay<0?"up":"down";
  const speed=player.speed*dt;
  const nx=player.x+ax*speed, ny=player.y+ay*speed;
  const blocked=scene==="town"?collidesTown:collidesInterior;
  if(!blocked(nx,player.y))player.x=nx;
  if(!blocked(player.x,ny))player.y=ny;
  player.x=Math.max(5,Math.min(155,player.x)); player.y=Math.max(38,Math.min(137,player.y));
}

function render(){
  if(scene==="town")drawTown(); else drawInterior();
  if(menuOpen)drawMenu();
}

function drawMenu(){
  rect(15,12,130,120,pal.ink);
  rect(17,14,126,116,pal.white);
  ctx.fillStyle=pal.ink;ctx.font="bold 8px monospace";ctx.fillText("MENU PRISMA",25,25);
  ctx.font="7px monospace";
  ctx.fillText("SQUADRA",28,40);
  ctx.fillText("PRISMACON",28,53);
  ctx.fillText("BORSA",28,66);
  ctx.fillText("SALVA",28,79);
  ctx.fillText("Torna al gioco",28,105);
  // two sample entries
  outlineRect(78,34,56,19,pal.grass2);
  ctx.fillStyle=pal.ink;ctx.fillText("LUMINELLO",83,45);ctx.fillText("HP 24/24",83,49);
  outlineRect(78,58,56,19,pal.grass2);
  ctx.fillText("???????",83,69);ctx.fillText("PRISMICON",83,73);
}

function showHint(t){
  const h=document.getElementById("hint");h.textContent=t;h.style.opacity=1;
  clearTimeout(showHint.t);showHint.t=setTimeout(()=>h.style.opacity=0,1600);
}
function openDialog(title,text){
  const d=document.getElementById("dialog");d.innerHTML="<b>"+title+"</b>"+text+"<br><small>Premi AZIONE per chiudere</small>";d.style.display="block";dialogOpen=true;
}
function closeDialog(){document.getElementById("dialog").style.display="none";dialogOpen=false;}

document.getElementById("actBtn").addEventListener("pointerdown",e=>{
  e.preventDefault(); if(dialogOpen){closeDialog();return;} interact();
});
document.getElementById("menuBtn").addEventListener("pointerdown",e=>{
  e.preventDefault();menuOpen=!menuOpen;
});

const joyEl=document.getElementById("joy"), knob=document.getElementById("knob");
function setJoy(e){
  const r=joyEl.getBoundingClientRect();
  let dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  const max=r.width*.38, d=Math.hypot(dx,dy);
  if(d>max){dx=dx/d*max;dy=dy/d*max;}
  joy.x=dx/max;joy.y=dy/max;
  knob.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;
}
function resetJoy(){
  joy.x=0;joy.y=0;joy.active=false;joy.id=null;
  knob.style.transform="translate(-50%,-50%)";
}
joyEl.addEventListener("pointerdown",e=>{
  e.preventDefault();joy.active=true;joy.id=e.pointerId;
  joyEl.setPointerCapture(e.pointerId);setJoy(e);
});
joyEl.addEventListener("pointermove",e=>{
  if(joy.active&&e.pointerId===joy.id){e.preventDefault();setJoy(e);}
});
joyEl.addEventListener("pointerup",e=>{if(e.pointerId===joy.id)resetJoy()});
joyEl.addEventListener("pointercancel",resetJoy);
joyEl.addEventListener("lostpointercapture",resetJoy);

window.addEventListener("keydown",e=>{
  keys[e.key]=true;
  if(e.key==="Escape")menuOpen=!menuOpen;
  if(e.key===" "||e.key==="Enter"){if(dialogOpen)closeDialog();else interact();}
});
window.addEventListener("keyup",e=>keys[e.key]=false);
window.addEventListener("contextmenu",e=>e.preventDefault());

let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!menuOpen&&!dialogOpen)move(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
showHint("Joystick: trascina e muovi il personaggio");
</script>
</body>
</html>
